name: Build LEDE Firmware

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Device config file"
        required: false
        default: "config/E20C.config"
      ssh:
        description: "SSH connection to Actions"
        required: false
        default: "false"

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: ${{ github.event.inputs.config || '' }}
  SSH_FILE: ${{ github.event.inputs.ssh || '' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Initialize environment
      run: |
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
      env:
        TZ: Asia/Shanghai

    - name: Clone source code
      run: |
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL /workdir/source
        git -C /workdir/source log -1 --format="%H %s"

    - name: Load custom configuration
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE /workdir/source/.config
      if: env.CONFIG_FILE != ''

    - name: Update feeds
      run: |
        cd /workdir/source
        sed -i "s/# EXCLUDE_FEEDS=exclude\/etc\/feeds.conf/exclude\/etc\/feeds.conf/" feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate configuration
      run: |
        cd /workdir/source
        [ -e .config ] && make defconfig || make menuconfig
        make defconfig

    - name: Download packages
      run: |
        cd /workdir/source
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -delete

    - name: Compile firmware
      run: |
        cd /workdir/source
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "BUILD_STATUS=success" >> $GITHUB_ENV
        echo "BUILD_DATE=$(date +"%Y.%m.%d.%H%M")" >> $GITHUB_ENV

    - name: Organize output files
      if: env.BUILD_STATUS == 'success'
      run: |
        cd /workdir/source
        mkdir -p /output
        find bin/targets/ -name "*.bin" -exec mv {} /output/ \;
        find bin/packages/ -name "*.ipk" -exec mv {} /output/packages/ \;

    - name: Upload firmware
      uses: actions/upload-artifact@v3
      if: env.BUILD_STATUS == 'success'
      with:
        name: OpenWrt_firmware_${{ env.BUILD_DATE }}
        path: /output/*

    - name: SSH Connection to Actions
      uses: mxschmitt/action-tmate@v3
      if: env.SSH_FILE == 'true'
      timeout-minutes: 30
