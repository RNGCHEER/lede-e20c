name: Build RADXA E20C LEDE Firmware

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Device config file"
        required: false
        default: "config/E20C.config"
      ssh:
        description: "SSH connection to Actions"
        required: false
        default: "false"

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: ${{ github.event.inputs.config || '' }}
  SSH_FILE: ${{ github.event.inputs.ssh || '' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize environment
      run: |
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
      env:
        TZ: Asia/Shanghai

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pyelftools \
          python3-setuptools \
          python3-pip \
          swig \
          gcc \
          g++ \
          make \
          libncurses-dev
        sudo pip3 install pyelftools
        python3 -c "import elftools; print('pyelftools OK')"

    - name: Clone source code
      run: |
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL /workdir/source
        git -C /workdir/source log -1 --format="%H %s"

    - name: Clone PassWall packages
      run: |
        cd /workdir/source
        # 克隆 PassWall 主程序和依赖包到 package 目录
        git clone --depth 1 https://github.com/xiaorouji/openwrt-passwall-packages.git package/passwall-packages
        git clone --depth 1 https://github.com/xiaorouji/openwrt-passwall.git package/passwall
        echo "PassWall packages cloned successfully"
        ls -la package/passwall-packages/ | head -20
        ls -la package/passwall/ | head -20

    - name: Load custom configuration
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE /workdir/source/.config
      if: env.CONFIG_FILE != ''

    - name: Update feeds
      run: |
        cd /workdir/source
        sed -i "s/# EXCLUDE_FEEDS=exclude\/etc\/feeds.conf/exclude\/etc\/feeds.conf/" feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate configuration
      run: |
        cd /workdir/source
        [ -e .config ] && make defconfig || make menuconfig
        make defconfig

    - name: Download packages
      run: |
        cd /workdir/source
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -delete

    - name: Compile firmware
      run: |
        cd /workdir/source
        export PYTHONPATH="/usr/lib/python3/dist-packages:/usr/local/lib/python3.12/dist-packages:$PYTHONPATH"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "BUILD_STATUS=success" >> $GITHUB_ENV
        echo "BUILD_DATE=$(date +"%Y.%m.%d.%H%M")" >> $GITHUB_ENV

    - name: Organize output files
      if: env.BUILD_STATUS == 'success'
      run: |
        cd /workdir/source
        mkdir -p ${{ runner.temp }}/output
        find bin/targets/ -name "*.bin" -exec cp {} ${{ runner.temp }}/output/ \;
        find bin/packages/ -name "*.ipk" -exec cp --parents {} ${{ runner.temp }}/output/packages/ \;
        cd ${{ runner.temp }}/output
        tar -czf openwrt-radxa-e20c-*.bin.tar.gz *.bin 2>/dev/null || true
        ls -lh ${{ runner.temp }}/output/

    - name: Upload firmware as artifact
      uses: actions/upload-artifact@v4
      if: env.BUILD_STATUS == 'success'
      with:
        name: RADXA_E20C_firmware_${{ env.BUILD_DATE }}
        path: ${{ runner.temp }}/output/*
        retention-days: 30

    - name: Publish firmware to GitHub Releases
      if: env.BUILD_STATUS == 'success'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ env.BUILD_DATE }}
        name: "RADXA E20C Firmware Build ${{ env.BUILD_DATE }}"
        body: |
          ## RADXA E20C LEDE固件
          
          **构建日期**: ${{ env.BUILD_DATE }}
          
          ### 📋 固件功能
          
          #### 💾 存储支持
          - ✅ **eMMC写入**: 支持直接将固件写入板载eMMC
          - ✅ **TF卡启动**: 支持从TF卡启动，便于测试和恢复
          - ✅ **ext4文件系统**: 高性能读写支持
          
          #### 📡 网络功能
          - ✅ **4G/5G模组**: QMI/MBIM/NCM/PPP拨号支持
          - ✅ **安卓USB共享**: RNDIS/NCM网络协议
          - ✅ **千兆以太网**: 2x 千兆以太网口
          
          #### 🐳 Docker支持
          - ✅ **Docker CE**: 完整容器环境
          - ✅ **LuCI管理**: 图形化管理界面
          - ✅ **多种网络**: bridge/host/ipvlan/macvlan
          
          #### 🔒 代理工具
          - ✅ **PassWall**: 全协议代理
          - ✅ **OpenClash**: Clash内核代理
          - ✅ **SmartDNS**: DNS加速
          
          ### 🔧 烧录方法
          
          #### 方法一：TF卡启动
          1. 下载固件文件
          2. 使用Balena Etcher或`dd`命令写入TF卡
          3. 将TF卡插入E20C
          4. 上电启动
          
          #### 方法二：写入eMMC
          1. 先从TF卡启动
          2. 使用`dd`命令将固件写入eMMC
          3. 断电移除TF卡
          4. 从eMMC启动
          
          #### 方法三：SSH网络安装
          1. 通过网线连接E20C
          2. 访问LuCI界面
          3. 在系统-备份/升级中上传固件
          
          ### 📚 相关资源
          
          - [RADXA E20C官方文档](https://docs.radxa.com/e/e20c/getting-started/introduction)
          - [coolsnowwolf/lede](https://github.com/coolsnowwolf/lede)
          - [openwrt-passwall](https://github.com/xiaorouji/openwrt-passwall)
          
          ### ⚠️ 注意事项
          
          1. 首次编译约需2-3小时
          2. 供电仅支持5V
          3. PassWall和OpenClash二选一使用
        files: ${{ runner.temp }}/output/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: SSH Connection to Actions
      uses: mxschmitt/action-tmate@v3
      if: env.SSH_FILE == 'true'
      timeout-minutes: 30
