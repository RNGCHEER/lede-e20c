name: Build RADXA E20C LEDE Firmware

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Device config file"
        required: false
        default: "config/E20C.config"
      ssh:
        description: "SSH connection to Actions"
        required: false
        default: "false"

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: ${{ github.event.inputs.config || '' }}
  SSH_FILE: ${{ github.event.inputs.ssh || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize environment
      run: |
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
      env:
        TZ: Asia/Shanghai

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pyelftools \
          python3-setuptools \
          python3-pip \
          swig \
          gcc \
          g++ \
          make \
          libncurses-dev
        sudo pip3 install pyelftools
        python3 -c "import elftools; print('pyelftools OK')"

    - name: Clone source code
      run: |
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL /workdir/source
        git -C /workdir/source log -1 --format="%H %s"

    - name: Clone PassWall packages
      run: |
        cd /workdir/source
        # PassWall 1 - 主程序和依赖包
        git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/passwall-packages
        git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall.git package/passwall
        # PassWall 2
        git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall2.git package/passwall2
        echo "PassWall packages cloned successfully"
        echo "=== PassWall Packages ==="
        ls package/passwall-packages/ | head -10
        echo "=== PassWall 1 ==="
        ls package/passwall/ | head -10
        echo "=== PassWall 2 ==="
        ls package/passwall2/ | head -10

    - name: Load custom configuration
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE /workdir/source/.config
      if: env.CONFIG_FILE != ''

    - name: Update feeds
      run: |
        cd /workdir/source
        sed -i "s/# EXCLUDE_FEEDS=exclude\/etc\/feeds.conf/exclude\/etc\/feeds.conf/" feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate configuration
      run: |
        cd /workdir/source
        [ -e .config ] && make defconfig || make menuconfig
        make defconfig

    - name: Download packages
      run: |
        cd /workdir/source
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -delete

    - name: Compile firmware
      run: |
        cd /workdir/source
        export PYTHONPATH="/usr/lib/python3/dist-packages:/usr/local/lib/python3.12/dist-packages:$PYTHONPATH"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "BUILD_STATUS=success" >> $GITHUB_ENV
        echo "BUILD_DATE=$(date +"%Y.%m.%d.%H%M")" >> $GITHUB_ENV

    - name: Debug - List build outputs
      if: env.BUILD_STATUS == 'success'
      run: |
        cd /workdir/source
        echo "=== Directory structure ==="
        find bin/ -type f -name "*.bin" -o -name "*.img.gz" -o -name "*.img" -o -name "*.tar.gz" | head -20
        echo "=== Looking for firmware files ==="
        find bin/targets/ -type f \( -name "*.bin" -o -name "*.img.gz" -o -name "*.img" \) -exec ls -lh {} \;
        echo "=== All files in bin/targets/ ==="
        ls -lhR bin/targets/ | head -50

    - name: Organize output files
      if: env.BUILD_STATUS == 'success'
      run: |
        cd /workdir/source
        mkdir -p ${{ runner.temp }}/output
        # 复制固件 (支持多种格式)
        find bin/targets/ -type f \( -name "*.bin" -o -name "*.img.gz" -o -name "*.img" \) -exec cp {} ${{ runner.temp }}/output/ \;
        # 复制 IPK 包（支持手动安装）
        mkdir -p ${{ runner.temp }}/output/packages
        find bin/packages/ -name "*.ipk" -exec cp {} ${{ runner.temp }}/output/packages/ \; 2>/dev/null || true
        # 打包 IPK 为 tar.gz 方便下载
        cd ${{ runner.temp }}/output
        # 创建固件压缩包 (如果有文件)
        if ls *.bin *.img.gz *.img 1> /dev/null 2>&1; then
          tar -czf openwrt-radxa-e20c-firmware.tar.gz *.bin *.img.gz *.img 2>/dev/null || true
        fi
        # 创建 IPK 压缩包
        if [ -d "packages" ] && [ "$(ls -A packages/ 2>/dev/null)" ]; then
          tar -czf openwrt-radxa-e20c-packages.tar.gz packages/ 2>/dev/null || true
        fi
        echo "=== Output Files ==="
        ls -lh ${{ runner.temp }}/output/
        # 检查是否有固件文件
        FIRMWARE_COUNT=$(find ${{ runner.temp }}/output/ -type f \( -name "*.bin" -o -name "*.img.gz" -o -name "*.img" \) | wc -l)
        echo "FIRMWARE_COUNT=${FIRMWARE_COUNT}" >> $GITHUB_ENV
        if [ "${FIRMWARE_COUNT}" -gt 0 ]; then
          echo "HAS_FIRMWARE=true" >> $GITHUB_ENV
        else
          echo "HAS_FIRMWARE=false" >> $GITHUB_ENV
          echo "⚠️ Warning: No firmware files found!"
        fi

    - name: Upload firmware as artifact
      uses: actions/upload-artifact@v4
      if: env.BUILD_STATUS == 'success'
      with:
        name: RADXA_E20C_firmware_${{ env.BUILD_DATE }}
        path: |
          ${{ runner.temp }}/output/*.bin
          ${{ runner.temp }}/output/*.img.gz
          ${{ runner.temp }}/output/*.img
          ${{ runner.temp }}/output/*.tar.gz
        retention-days: 30

    - name: Upload IPK packages as artifact
      uses: actions/upload-artifact@v4
      if: env.BUILD_STATUS == 'success'
      with:
        name: RADXA_E20C_packages_${{ env.BUILD_DATE }}
        path: ${{ runner.temp }}/output/packages/*.ipk
        retention-days: 30

    - name: Publish firmware to GitHub Releases
      if: env.BUILD_STATUS == 'success' && env.HAS_FIRMWARE == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ env.BUILD_DATE }}
        name: "RADXA E20C Firmware Build ${{ env.BUILD_DATE }}"
        body: |
          ## RADXA E20C LEDE固件
          
          **构建日期**: ${{ env.BUILD_DATE }}
          
          ### 📋 固件功能
          
          #### 💾 存储支持
          - ✅ **eMMC写入**: 支持直接将固件写入板载eMMC
          - ✅ **TF卡启动**: 支持从TF卡启动
          - ✅ **ext4文件系统**: 高性能读写支持
          
          #### 📡 网络功能
          - ✅ **4G/5G模组**: QMI/MBIM/NCM/PPP拨号
          - ✅ **安卓USB共享**: RNDIS/NCM
          - ✅ **千兆以太网**: 2x 千兆口
          
          #### 🐳 Docker支持
          - ✅ **Docker CE**: 完整容器环境
          - ✅ **LuCI管理**: 图形化界面
          
          #### 🔒 代理工具
          - ✅ **PassWall 1**: 全协议代理
          - ✅ **PassWall 2**: 备用代理
          - ✅ **OpenClash**: Clash内核
          - ✅ **SmartDNS**: DNS加速
          
          ### 📦 下载说明
          
          | 文件 | 说明 |
          |------|------|
          | `*-firmware.tar.gz` | 固件文件（刷机用） |
          | `*-packages.tar.gz` | IPK软件包（手动安装用） |
          | `*.bin`, `*.img.gz`, `*.img` | 单独固件文件 |
          
          ### 🔧 烧录方法
          
          #### 方法一：TF卡启动
          1. 下载固件文件
          2. 使用Balena Etcher或`dd`命令写入TF卡
          3. 将TF卡插入E20C
          4. 上电启动
          
          #### 方法二：写入eMMC
          1. 先从TF卡启动
          2. 使用`dd`命令将固件写入eMMC
          3. 断电移除TF卡
          4. 从eMMC启动
          
          #### 方法三：LuCI在线安装IPK
          1. 访问 LuCI → 系统 → 备份/升级
          2. 上传固件进行升级
          
          ### 📚 相关资源
          
          - [RADXA E20C官方文档](https://docs.radxa.com/e/e20c/getting-started/introduction)
          - [coolsnowwolf/lede](https://github.com/coolsnowwolf/lede)
          - [PassWall 1](https://github.com/Openwrt-Passwall/openwrt-passwall)
          - [PassWall 2](https://github.com/Openwrt-Passwall/openwrt-passwall2)
          
          ### ⚠️ 注意事项
          
          1. 首次编译约需2-3小时
          2. 供电仅支持5V
          3. PassWall和OpenClash二选一使用
          4. IPK包可在LuCI中手动安装
        files: |
          ${{ runner.temp }}/output/*.bin
          ${{ runner.temp }}/output/*.img.gz
          ${{ runner.temp }}/output/*.img
          ${{ runner.temp }}/output/*.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: SSH Connection to Actions
      uses: mxschmitt/action-tmate@v3
      if: env.SSH_FILE == 'true'
      timeout-minutes: 30
